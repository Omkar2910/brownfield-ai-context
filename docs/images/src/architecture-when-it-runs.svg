<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 544' width='760' height='544' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker></defs><rect width='760' height='544' fill='#fff'/><text x='24' y='32' font-size='16' font-weight='600' fill='#1f2328' text-anchor='start'>The kit checks knowledge at seven moments; only one of them blocks</text><rect x='24' y='60' width='712' height='172' rx='8' fill='#f6f8fa' stroke='none'/><text x='40' y='84' font-size='12' font-weight='600' fill='#57606a' text-anchor='start'>In the chat</text><rect x='144' y='68' width='592' height='44' rx='8' fill='#fff' stroke='#8c959f' stroke-width='1.25'/><circle cx='168' cy='90' r='11' fill='#0969da'/><text x='168' y='94.5' font-size='12' font-weight='600' fill='#fff' text-anchor='middle'>1</text><text x='190' y='87' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Chat starts</text><text x='720' y='87' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='end'>Agent</text><text x='190' y='104' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>A short note: kit health, pages out of date</text><rect x='144' y='120' width='592' height='44' rx='8' fill='#fff' stroke='#8c959f' stroke-width='1.25'/><circle cx='168' cy='142' r='11' fill='#0969da'/><text x='168' y='146.5' font-size='12' font-weight='600' fill='#fff' text-anchor='middle'>2</text><text x='190' y='139' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>After each agent edit</text><text x='720' y='139' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='end'>Agent</text><text x='190' y='156' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>Names the lines anchored to the file it just edited</text><rect x='144' y='172' width='592' height='44' rx='8' fill='#fff' stroke='#8c959f' stroke-width='1.25'/><circle cx='168' cy='194' r='11' fill='#0969da'/><text x='168' y='198.5' font-size='12' font-weight='600' fill='#fff' text-anchor='middle'>3</text><text x='190' y='191' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Agent says it is done</text><text x='720' y='191' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='end'>Agent</text><text x='190' y='208' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>Asks once: are the lines anchored to your edits still true?</text><rect x='24' y='244' width='712' height='120' rx='8' fill='#f6f8fa' stroke='none'/><text x='40' y='268' font-size='12' font-weight='600' fill='#57606a' text-anchor='start'>In git</text><rect x='144' y='252' width='592' height='44' rx='8' fill='#fff' stroke='#8c959f' stroke-width='1.25'/><circle cx='168' cy='274' r='11' fill='#0969da'/><text x='168' y='278.5' font-size='12' font-weight='600' fill='#fff' text-anchor='middle'>4</text><text x='190' y='271' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Commit</text><text x='720' y='271' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='end'>Developer</text><text x='190' y='288' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>Blocks only knowledge pointing at a missing file; warns about the rest</text><rect x='144' y='304' width='592' height='44' rx='8' fill='#fff' stroke='#8c959f' stroke-width='1.25'/><circle cx='168' cy='326' r='11' fill='#0969da'/><text x='168' y='330.5' font-size='12' font-weight='600' fill='#fff' text-anchor='middle'>5</text><text x='190' y='323' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Pull request (optional)</text><text x='720' y='323' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='end'>Reviewer</text><text x='190' y='340' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>The same check, whoever or whatever wrote the code</text><rect x='24' y='376' width='712' height='120' rx='8' fill='#f6f8fa' stroke='none'/><text x='40' y='400' font-size='12' font-weight='600' fill='#57606a' text-anchor='start'>In the story</text><rect x='144' y='384' width='592' height='44' rx='8' fill='#fff' stroke='#8c959f' stroke-width='1.25'/><circle cx='168' cy='406' r='11' fill='#0969da'/><text x='168' y='410.5' font-size='12' font-weight='600' fill='#fff' text-anchor='middle'>6</text><text x='190' y='403' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>/story-finish</text><text x='720' y='403' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='end'>Agent + reviewer</text><text x='190' y='420' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>Every scenario has a test; pages for changed files still true</text><rect x='144' y='436' width='592' height='44' rx='8' fill='#fff' stroke='#8c959f' stroke-width='1.25'/><circle cx='168' cy='458' r='11' fill='#0969da'/><text x='168' y='462.5' font-size='12' font-weight='600' fill='#fff' text-anchor='middle'>7</text><text x='190' y='455' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>/opsx-archive</text><text x='720' y='455' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='end'>Developer</text><text x='190' y='472' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>The story’s specs merge into the permanent specs</text><text x='24' y='522' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>Every check calls the same context tool, so each rule is defined once. It knows which file changed, not what changed in it.</text></svg>
