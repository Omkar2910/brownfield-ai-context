<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 304' width='760' height='304' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker></defs><rect width='760' height='304' fill='#fff'/><text x='24' y='32' font-size='16' font-weight='600' fill='#1f2328' text-anchor='start'>People approve the plan and the code; the agent does the rest</text><rect x='24' y='60' width='160' height='56' rx='8' fill='#fff' stroke='#8c959f' stroke-width='1.25'/><text x='104.0' y='83' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>1. /story-start</text><text x='104.0' y='103' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='middle'>work item, code, context</text><path d='M184 88H206' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end="url(#a)"/><rect x='208' y='60' width='160' height='56' rx='8' fill='#fff' stroke='#8c959f' stroke-width='1.25'/><text x='288.0' y='83' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>2. Plan</text><text x='288.0' y='103' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='middle'>OpenSpec or plan.md</text><path d='M368 88H390' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end="url(#a)"/><rect x='392' y='60' width='160' height='56' rx='8' fill='#fff' stroke='#8c959f' stroke-width='1.25'/><text x='472.0' y='83' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>3. Fresh-eyes review</text><text x='472.0' y='103' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='middle'>design reviewer agent</text><path d='M552 88H574' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end="url(#a)"/><rect x='576' y='60' width='160' height='56' rx='8' fill='#ddf4ff' stroke='#0969da' stroke-width='2'/><text x='656.0' y='83' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>4. Person approves</text><text x='656.0' y='103' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='middle'>the plan, before any code</text><path d='M656.0 116V170' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end="url(#a)"/><rect x='576' y='172' width='160' height='56' rx='8' fill='#fff' stroke='#8c959f' stroke-width='1.25'/><text x='656.0' y='195' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>5. Build</text><text x='656.0' y='215' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='middle'>test first, then code</text><path d='M576 200H554' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end="url(#a)"/><rect x='392' y='172' width='160' height='56' rx='8' fill='#fff' stroke='#8c959f' stroke-width='1.25'/><text x='472.0' y='195' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>6. /story-finish</text><text x='472.0' y='215' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='middle'>tests, context, PR text</text><path d='M392 200H370' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end="url(#a)"/><rect x='208' y='172' width='160' height='56' rx='8' fill='#ddf4ff' stroke='#0969da' stroke-width='2'/><text x='288.0' y='195' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>7. Pull request</text><text x='288.0' y='215' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='middle'>a person reviews, merges</text><path d='M208 200H186' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end="url(#a)"/><rect x='24' y='172' width='160' height='56' rx='8' fill='#fff' stroke='#8c959f' stroke-width='1.25'/><text x='104.0' y='195' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>8. Archive</text><text x='104.0' y='215' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='middle'>specs updated</text><text x='24' y='264' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>Tiny fixes skip steps 2 to 4: a failing test, the fix, /story-finish. Without OpenSpec, step 2 is one plan.md and step 8 does not exist.</text><text x='24' y='284' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>The developer commits, pushes and opens the pull request; the agent never pushes or merges.</text></svg>
