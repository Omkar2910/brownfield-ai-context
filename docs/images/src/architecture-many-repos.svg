<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 524' width='760' height='524' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker></defs><rect width='760' height='524' fill='#fff'/><text x='24' y='32' font-size='16' font-weight='600' fill='#1f2328' text-anchor='start'>Tools live once in the home repo; knowledge lives in each code repo</text><rect x='230' y='52' width='300' height='56' rx='8' fill='#fff' stroke='#8c959f' stroke-width='1.25'/><text x='380.0' y='75' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>Your agent</text><text x='380.0' y='95' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='middle'>Copilot · Claude Code · Codex</text><path d='M300 108V134H188V158' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end="url(#a)"/><path d='M460 108V134H572V146' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end="url(#a)"/><text x='244' y='127' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='middle'>skills, hooks</text><text x='516' y='127' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='middle'>reads knowledge</text><rect x='24' y='160' width='328' height='196' rx='8' fill='#ddf4ff' stroke='#0969da' stroke-width='2'/><text x='40' y='186' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Home repo: product-context</text><text x='40' y='214' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>Skills and helper agents (once)</text><text x='40' y='238' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>Hooks and the context tool</text><text x='40' y='262' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>Commit check: .githooks/</text><text x='40' y='286' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>catalog.json: who calls whom</text><text x='40' y='310' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>Flows across repos, step by step</text><text x='40' y='334' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>Platform rules, glossary</text><path d='M420 160V148H736V344H724' fill='none' stroke='#8c959f'/><path d='M414 160V154H730V350H724' fill='none' stroke='#8c959f'/><rect x='408' y='160' width='316' height='196' rx='8' fill='#fff' stroke='#8c959f' stroke-width='1.25'/><text x='424' y='186' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Each code repo: service, UI, library</text><text x='424' y='214' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>AGENTS.md: read in every chat</text><text x='424' y='238' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>Rule files, loaded by file type</text><text x='424' y='262' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>docs/context/: its pages, its tables</text><text x='424' y='286' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>Its business rules and traps</text><text x='424' y='310' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>openspec/: one folder per story</text><text x='424' y='334' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>.ai-kit/kit.json: a small stamp</text><path d='M188 356V394' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end="url(#a)"/><path d='M572 356V394' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end="url(#a)"/><path d='M440 424H380V262H354' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end="url(#a)"/><text x='198' y='380' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>pipeline runs the home tool</text><text x='582' y='380' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>you commit</text><rect x='64' y='396' width='248' height='56' rx='8' fill='#fff' stroke='#8c959f' stroke-width='1.25'/><text x='188.0' y='419' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>Pull request check</text><text x='188.0' y='439' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='middle'>optional · home repo + code repo</text><rect x='440' y='396' width='264' height='56' rx='8' fill='#fff' stroke='#8c959f' stroke-width='1.25'/><text x='572.0' y='419' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>git commit in a code repo</text><text x='572.0' y='439' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='middle'>runs the home repo commit check</text><text x='24' y='484' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>One team can change it in one pull request: it lives in that repo. Two repos must agree: it lives in the home repo.</text><text x='24' y='502' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>Product pages link down to repo pages and never copy them.</text></svg>
